[project]
name = "shared"
version = "0.1.0"
description = "THIRA shared types, schemas, LLM abstraction, database, and event bus"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.0",
    "openai>=1.50",
    "litellm>=1.40",
    "structlog>=24.0",
    "httpx>=0.27",
]
