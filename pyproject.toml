[project]
name = "thira"
version = "0.1.0"
description = "THIRA — Agentic Intelligence & Autonomous Execution Platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "shared",
    "thira-core",
    "echo",
    "jarvis",
    "agents",
    "event-bus",
    "uvicorn[standard]>=0.30",
    "structlog>=24.0",
]

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/thira-core",
    "packages/echo",
    "packages/jarvis",
    "packages/agents",
    "packages/event-bus",
]

[tool.uv.sources]
shared = { workspace = true }
thira-core = { workspace = true }
echo = { workspace = true }
jarvis = { workspace = true }
agents = { workspace = true }
event-bus = { workspace = true }


[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.0",
    "ruff>=0.7",
    "pyright>=1.1",
    "httpx>=0.27",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "thira_core", "echo", "jarvis", "agents", "event_bus"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
